<div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4 mb-8">
  <div>
    <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-primary-fixed text-on-primary-container border border-outline-variant/40 text-xs font-semibold mb-4">
      <span class="material-symbols-outlined text-[16px]">security</span>
      {{ eyebrow|default:"RideGarde" }}
    </div>
    <h1 class="text-3xl md:text-4xl font-bold text-primary tracking-[-0.02em] leading-tight font-display">{{ title }}</h1>
    {% if subtitle %}
      <p class="text-sm md:text-base text-on-surface-variant mt-3 max-w-2xl">{{ subtitle }}</p>
    {% endif %}
  </div>
  {% if action_url %}
    <a href="{% url action_url %}" class="btn btn-primary shadow-glow">
      {% if action_icon %}<span class="material-symbols-outlined text-[18px]">{{ action_icon }}</span>{% endif %}
      {{ action_label }}
    </a>
  {% endif %}
</div>
